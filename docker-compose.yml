services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: playslot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d playslot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports: ["5000:8080"]
    environment:
      ConnectionStrings__Default: "Host=db;Database=playslot;Username=postgres;Password=postgres"
      Jwt__Key: "super-secret-key-32chars-minimum!"
      Jwt__Issuer: "PlaySlot"
      Jwt__Audience: "PlaySlot"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  pgdata:

server {
    listen       8080;
    server_name  _;
    server_tokens off;
    root         /usr/share/nginx/html;
    index        index.html;

    include /etc/nginx/security-headers.conf;

    location ~ /\.(?!well-known) {
        return 404;
    }

    # gzip для текстовых ассетов
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Vite отдаёт ассеты с хешем в имени — кэшируем максимально жёстко.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        include    /etc/nginx/security-headers.conf;
        try_files  $uri =404;
    }

    # SPA history fallback — любой маршрут возвращает index.html.
    # HTML не кэшируем (ни браузером, ни Cloudflare), чтобы новый деплой
    # с обновлёнными ссылками на хешированные ассеты сразу вступал в силу.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
        include    /etc/nginx/security-headers.conf;
    }

    # сам index.html не кэшируем, чтобы деплой сразу вступал в силу.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        include    /etc/nginx/security-headers.conf;
    }
}
